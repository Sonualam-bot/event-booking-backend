services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      # Overrides whatever MONGODB_URI is in .env (e.g. an Atlas URI) so a
      # plain `docker compose up` is fully self-contained — no external
      # Mongo/Atlas account needed to run this locally.
      MONGODB_URI: mongodb://mongo:27017/event-booking
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
